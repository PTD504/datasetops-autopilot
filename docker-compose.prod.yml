version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-datasetops}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-datasetops}
      - STORAGE_MODE=${STORAGE_MODE:-oss}
      - MOCK_LLM=${MOCK_LLM:-false}
      - ALLOW_LLM_FALLBACK=${ALLOW_LLM_FALLBACK:-false}
      - RUN_MODE=${RUN_MODE:-real_full}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      - QWEN_GUARDRAILS_ENABLED=${QWEN_GUARDRAILS_ENABLED:-true}
      - QWEN_MAX_CALLS_PER_RUN=${QWEN_MAX_CALLS_PER_RUN:-50}
      - QWEN_MAX_INPUT_TOKENS_PER_RUN=${QWEN_MAX_INPUT_TOKENS_PER_RUN:-100000}
      - QWEN_MAX_OUTPUT_TOKENS_PER_RUN=${QWEN_MAX_OUTPUT_TOKENS_PER_RUN:-20000}
      - QWEN_MAX_TOTAL_TOKENS_PER_RUN=${QWEN_MAX_TOTAL_TOKENS_PER_RUN:-120000}
      - QWEN_MAX_ESTIMATED_COST_USD_PER_RUN=${QWEN_MAX_ESTIMATED_COST_USD_PER_RUN:-1.0}
      - QWEN_MAX_SAMPLES_PER_REAL_RUN=${QWEN_MAX_SAMPLES_PER_REAL_RUN:-5}
      - QWEN_MAX_REPAIR_ATTEMPTS_PER_SAMPLE=${QWEN_MAX_REPAIR_ATTEMPTS_PER_SAMPLE:-1}
      - QWEN_STOP_ON_BUDGET_EXCEEDED=${QWEN_STOP_ON_BUDGET_EXCEEDED:-true}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      - ALIBABA_CLOUD_OSS_ENDPOINT=${ALIBABA_CLOUD_OSS_ENDPOINT}
      - ALIBABA_CLOUD_OSS_BUCKET=${ALIBABA_CLOUD_OSS_BUCKET}
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data_prod:
